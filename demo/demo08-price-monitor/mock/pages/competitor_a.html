<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Linen Bedding Set — Competitor A</title></head>
<body>
<!-- 快照情境：正常頁面，暢銷品從 $129.00 降到 $105.78（-18%），對應書中 Sarah Chen 案例 -->
<main>
  <h1>Stonewashed Linen Bedding Set</h1>
  <div class="product-pricing">
    <!-- 故意把「原價」放在目標元素前面，用來驗證 class 比對是精確比對（price--was != price） -->
    <span class="price--was">$129.00</span>
    <span class="price">$105.78</span>
    <span class="price-note">Weekend flash sale — ends Sunday</span>
  </div>
  <p class="availability">In stock</p>
</main>
</body>
</html>
